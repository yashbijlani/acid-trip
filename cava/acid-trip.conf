# Acid Trip cava config -- colours come straight from colors.toml.
# Used by acid-trip-visualizer, which runs it in a pinned floating foot window.

[general]
framerate = 60
# 0 = auto: fit the bar count to the window width. A fixed count larger than
# the window makes cava exit non-zero, which would close the foot window.
bars = 0
autosens = 1
sensitivity = 100
lower_cutoff_freq = 40
higher_cutoff_freq = 16000
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = ncurses

[smoothing]
monstercat = 1
waves = 1
noise_reduction = 0.77

[color]
background = 'default'
foreground = 'default'
gradient = 1
gradient_count = 4
gradient_color_1 = '#39ff14'
gradient_color_2 = '#17f0ff'
gradient_color_3 = '#3a5bff'
gradient_color_4 = '#ff2bd6'
