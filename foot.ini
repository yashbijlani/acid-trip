# Acid Trip terminal palette.
#
# Shipped directly (instead of letting Omarchy's template generate it) so the
# alpha / alpha-mode / blur keys below survive: the generator only writes the
# template's colour keys. Palette values mirror colors.toml.
#
# foot reads this through the include= line in ~/.config/foot/foot.ini.
# alpha-mode=default keeps only the default background translucent, so text
# cell backgrounds stay solid and glyphs remain readable.

[colors-dark]
foreground=d9cdf2
background=0b0418
selection-foreground=f1e9ff
selection-background=2a1550

cursor=0b0418 f1e9ff

# Translucency + background blur (blur needs compositor
# ext-background-effect-v1; Hyprland's own blur covers it otherwise).
alpha=0.88
alpha-mode=default
blur=yes

regular0=0b0418
regular1=ff2e63
regular2=39ff14
regular3=efff3d
regular4=3a5bff
regular5=ff2bd6
regular6=17f0ff
regular7=d9cdf2

bright0=46325f
bright1=ff6b8f
bright2=9dff4d
bright3=fbff9e
bright4=8aa0ff
bright5=ff86ea
bright6=93fbff
bright7=f1e9ff
